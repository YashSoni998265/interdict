# Install once per clone:   uvx pre-commit install
# Run on everything:        uvx pre-commit run --all-files
# solution.md (long specification tables) is skipped by the whitespace fixers and ruff.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: trailing-whitespace
        exclude: ^solution\.md$
      - id: end-of-file-fixer
        exclude: ^solution\.md$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^solution\.md$
      - id: ruff-format
        exclude: ^solution\.md$
