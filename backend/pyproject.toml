[project]
name = "interdict"
version = "0.1.0"
description = "Graph-grounded security triage on FalkorDB"
requires-python = ">=3.12"
dependencies = [
    "anthropic==1.13.0",
    "falkordb>=1.8.0",
    "fastapi==0.143.0",
    "mcp==2.3.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interdict", "src/interdict_oracle"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"] # the formatter wraps code; long strings and messages are allowed

[tool.ruff.lint.isort]
known-first-party = ["interdict", "interdict_oracle", "graph_helpers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
