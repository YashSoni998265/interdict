name: Task
description: A unit of planned work from the build plan
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should exist when this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete, checkable outcomes. Reference FR/TC IDs from solution.md where they apply.
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Spec reference
      placeholder: "solution.md §8.7"
