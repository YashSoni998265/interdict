version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope

  # uv and npm use a fixed "build(deps)" prefix: include: scope would title
  # dev-dependency updates "build(deps-dev)", which is not an allowed PR-title scope.
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      # React's packages move together: a react-dom or @types/react-dom major on its own
      # cannot install against react 18.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # ESLint 10 waits for eslint-plugin-jsx-a11y, whose latest release (6.10.2) supports ESLint 9 at most.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
