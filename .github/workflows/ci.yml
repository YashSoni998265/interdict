name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
          scopes: |
            engine
            oracle
            seed
            api
            mcp
            agent
            web
            infra
            docs
            ci
            deps
          requireScope: false

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # gitleaks-action comments on the PR if it finds a leak
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Run pre-commit hooks
        env:
          SKIP: no-commit-to-branch,gitleaks # branch rule is local-only; gitleaks runs in its own job
        run: uvx pre-commit run --all-files --show-diff-on-failure

  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      falkordb:
        # Same pinned release and digest as docker-compose.yml (solution.md §17, gate G0)
        image: falkordb/falkordb:v4.22.1@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
        env:
          BROWSER: "0"
          REDIS_ARGS: --requirepass ci-ephemeral
          FALKORDB_ARGS: MAX_QUEUED_QUERIES 25 TIMEOUT_MAX 30000 TIMEOUT_DEFAULT 1000 RESULTSET_SIZE 100000
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a ci-ephemeral --no-auth-warning ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FALKORDB_HOST: localhost
      FALKORDB_PORT: "6379"
      FALKORDB_PASSWORD: ci-ephemeral # throwaway password for the job's own container
      FALKORDB_RESULTSET_SIZE: "100000"
      INTERDICT_REQUIRE_FALKORDB: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Test against FalkorDB
        run: uv run pytest -q

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22" # LTS
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (locked)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # Single required status check for branch protection. pr-title is skipped on pushes to main.
  ci-pass:
    name: ci-pass
    if: always()
    needs: [pr-title, secrets-scan, hygiene, backend, web]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then exit 1; fi
          done
